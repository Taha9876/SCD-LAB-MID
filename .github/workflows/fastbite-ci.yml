name: FastBite build and publish

# Every merge (push) into main tests the whole platform and then publishes a
# fresh image for each of the six services to GitHub Container Registry.
# Pull requests run the same test but publish nothing.
on:
  push:
    branches: [main]
    paths:
      - "Q2-cafe-system/**"
      - ".github/workflows/fastbite-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Q2-cafe-system/**"
      - ".github/workflows/fastbite-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastbite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Smoke test (all services in Docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Q2-cafe-system
    steps:
      - uses: actions/checkout@v5

      - name: Create a throwaway .env (no secret is stored in the repository)
        run: |
          echo "MONGO_ROOT_USERNAME=ci" > .env
          echo "MONGO_ROOT_PASSWORD=$(openssl rand -hex 24)" >> .env

      - name: Build and start MongoDB and the six services
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Hamza orders a Zinger Burger and Fries, then pays
        run: |
          set -euo pipefail
          gw=http://127.0.0.1:3000
          curl -fsS "$gw/health"; echo
          curl -fsS "$gw/menu" | jq -e 'length == 4'
          curl -fsS "$gw/customers/C-1042" | jq -e '.loyaltyPoints == 150'
          order=$(curl -fsS -X POST "$gw/orders" -H 'Content-Type: application/json' \
            -d '{"customerId":"C-1042","items":[{"itemId":"M-101","quantity":1},{"itemId":"M-102","quantity":1}]}')
          echo "$order" | jq .
          # Rs. 650 order -> 65 points (1 per Rs. 10) -> 150 + 65 = 215, free drink unlocked
          echo "$order" | jq -e '.total == 650 and .pointsEarned == 65 and .loyalty.loyaltyPoints == 215 and .loyalty.freeDrinkUnlocked'
          id=$(echo "$order" | jq -r .orderId)
          curl -fsS -X POST "$gw/payments" -H 'Content-Type: application/json' \
            -d "{\"orderId\":\"$id\",\"amount\":650}" | jq -e '.status == "PAID"'
          curl -fsS "$gw/orders/$id" | jq -e '.status == "PAID"'
          curl -fsS "$gw/inventory/M-101" | jq -e '.quantity == 79'

      - name: Show container status and logs
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color

      - name: Stop and remove everything
        if: always()
        run: docker compose down -v

  publish:
    name: Publish ${{ matrix.service }}
    needs: smoke-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - menu-service
          - order-service
          - inventory-service
          - customer-service
          - payment-service
    steps:
      - uses: actions/checkout@v5

      - name: Work out the image name (registry names must be lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fastbite-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry with the built-in token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Q2-cafe-system/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
